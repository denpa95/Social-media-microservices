services:
  api-gateway:
    build: ./APIGateway
    image: api-gateway:1.0
    ports: -"3000:3000"
    env_file: ./APIGateway/.env
    depends_on: -redis
    environment: -REDIS_URL=redis://localhost:6379

  identity-service:
    build: ./IdentityMicroservice
    image: identity-microservice:1.0
    ports: -"3001:3001"
    env_file: ./IdentityMicroservice/.env
    depends_on: -redis
    environment: -REDIS_URL=redis://localhost:6379

  media-service:
    build: ./MediaMicroservice
    image: media-microservice:1.0
    ports: -"3003:3003"
    env_file: ./MediaMicroservice/.env
    depends_on: 
      -redis
      -rabbitmq
    environment: -REDIS_URL=redis://localhost:6379
      -RABBITMQ_URL=amqp://localhost:5672

  post-search-service:
    build: ./PostSearchMicroservice/.env
    image: post-search-microservice:1.0
    ports: -"3002:3002"
    env_file: ./PostSearchMicroservice/.env
    depends_on: 
      -redis
      -rabbitmq
    environment: -REDIS_URL=redis://localhost:6379
      -RABBITMQ_URL=amqp://localhost:5672

  user-post-service:
    build: ./UserPostMicroservice
    image: user-post-service:1.0
    ports: -"3002:3002"
    env_file: ./UserPostMicroservice/.env
    depends_on: 
      -redis
      -rabbitmq
    environment: -REDIS_URL=redis://localhost:6379
      -RABBITMQ_URL=amqp://localhost:5672

  redis:
    image: redis:alpine
    ports: --"6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports: 
      -"5672:5672"
      -"15672:15673"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start-period: 15s
      